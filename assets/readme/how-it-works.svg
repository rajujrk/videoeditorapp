<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">How TechieVideoEditor works</title>
  <desc id="desc">Media is decoded with FFmpeg and VideoToolbox, edited on a timeline model in plain C++, composited with effects, grades, titles and transitions on the GPU through Metal, then played or exported. Beneath it, analysis runs on the Mac (whisper.cpp, DeepFilterNet3 on ONNX Runtime, Apple Vision, Core ML), and cloud AI is optional with your own keys. The interface is Qt Quick in eleven languages, with Audio Unit, VST3 and OpenFX plug-ins.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7380"/>
    </marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="#0F1115"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- The pipeline: one lane, four stages, like clips on a track. -->
    <g id="pipeline">
      <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.6" fill="#A3AAB6">FROM MEDIA TO FILE</text>

      <g transform="translate(64 78)">
        <rect width="250" height="168" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect width="250" height="8" rx="4" fill="#3D6FD9"/>
        <text x="20" y="48" font-size="26" font-weight="700" fill="#E8EAEE">Media in</text>
        <text x="20" y="82" font-size="20" fill="#E8EAEE">Video, sound, photos,</text>
        <text x="20" y="108" font-size="20" fill="#E8EAEE">RAW, EXR, sequences</text>
        <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A3AAB6">FFmpeg · VideoToolbox</text>
      </g>
      <path d="M318 162 H336" stroke="#6B7380" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(338 78)">
        <rect width="250" height="168" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect width="250" height="8" rx="4" fill="#A35CD1"/>
        <text x="20" y="48" font-size="26" font-weight="700" fill="#E8EAEE">Timeline</text>
        <text x="20" y="82" font-size="20" fill="#E8EAEE">Tracks, clips, keyframes,</text>
        <text x="20" y="108" font-size="20" fill="#E8EAEE">every edit undoable</text>
        <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A3AAB6">core/ · plain C++20</text>
      </g>
      <path d="M592 162 H610" stroke="#6B7380" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(612 78)">
        <rect width="250" height="168" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect width="250" height="8" rx="4" fill="#FF5A5F"/>
        <text x="20" y="48" font-size="26" font-weight="700" fill="#E8EAEE">On the GPU</text>
        <text x="20" y="82" font-size="20" fill="#E8EAEE">Grades, effects, titles,</text>
        <text x="20" y="108" font-size="20" fill="#E8EAEE">transitions, layers</text>
        <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A3AAB6">Metal via Qt RHI</text>
      </g>
      <path d="M866 162 H884" stroke="#6B7380" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(886 78)">
        <rect width="250" height="168" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect width="250" height="8" rx="4" fill="#2FA77A"/>
        <text x="20" y="48" font-size="26" font-weight="700" fill="#E8EAEE">Play and export</text>
        <text x="20" y="82" font-size="20" fill="#E8EAEE">4K at 60 fps; MP4, MOV,</text>
        <text x="20" y="108" font-size="20" fill="#E8EAEE">ProRes, GIF, WAV, MP3</text>
        <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A3AAB6">VideoToolbox · queue</text>
      </g>
    </g>

    <!-- Beneath it: what thinks about the media, and where. -->
    <g id="intelligence">
      <text x="64" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.6" fill="#A3AAB6">UNDERSTANDING THE MEDIA</text>

      <g transform="translate(64 318)">
        <rect width="660" height="128" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect x="0" y="0" width="8" height="128" rx="4" fill="#2FA77A"/>
        <text x="28" y="40" font-size="24" font-weight="700" fill="#E8EAEE">On this Mac</text>
        <text x="200" y="40" font-size="20" fill="#A3AAB6">nothing uploaded</text>
        <text x="28" y="76" font-size="20" fill="#E8EAEE">Captions (whisper.cpp) · speech cleanup (DeepFilterNet3)</text>
        <text x="28" y="104" font-size="20" fill="#E8EAEE">faces, people, tracking (Vision) · depth (Core ML)</text>
      </g>

      <g transform="translate(748 318)">
        <rect width="388" height="128" rx="12" fill="#171A20" stroke="#262B34"/>
        <rect x="0" y="0" width="8" height="128" rx="4" fill="#6E95FF"/>
        <text x="28" y="40" font-size="24" font-weight="700" fill="#E8EAEE">Your own keys</text>
        <text x="206" y="40" font-size="20" fill="#A3AAB6">optional</text>
        <text x="28" y="76" font-size="20" fill="#E8EAEE">Claude · OpenAI · Google ·</text>
        <text x="28" y="104" font-size="20" fill="#E8EAEE">ElevenLabs, keys in Keychain</text>
      </g>
    </g>

    <g id="interface">
      <rect x="64" y="470" width="1072" height="44" rx="10" fill="#1E222A"/>
      <text x="88" y="499" font-size="20" fill="#E8EAEE">Qt Quick interface · 11 languages · dark and light · Audio Unit, VST3 and OpenFX plug-ins</text>
    </g>
  </g>
</svg>
